<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA Deals Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .cart {
      background: white;
      color: #111827;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      background: white;
      color: #2563eb;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 40px 5%;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      padding-bottom: 18px;
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product h3 {
      padding: 15px 15px 5px;
    }

    .price {
      padding: 5px 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .buy-btn {
      margin: 12px 15px 0;
      width: calc(100% - 30px);
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      background: #111827;
      color: white;
      padding: 25px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🇺🇸 USA Deals Store</div>
    <div class="cart">
      🛒 Cart: <span id="cartCount">0</span>
    </div>
  </header>

  <section class="hero">
    <h1>USA Deals Store</h1>
    <p>Great Products. Great Deals. Great Prices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </section>

  <section class="products" id="products">
    <h2>🔥 Today's Deals</h2>

    <div class="product-grid">

      <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80">
        <h3>Smart Watch</h3>
        <div class="price">$29.99</div>
        <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80">
        <h3>Wireless Headphones</h3>
        <div class="price">$39.99</div>
        <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?auto=format&fit=crop&w=600&q=80">
        <h3>Travel Backpack</h3>
        <div class="price">$24.99</div>
        <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80">
        <h3>Running Shoes</h3>
        <div class="price">$49.99</div>
        <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 USA Deals Store — All Rights Reserved
  </footer>

  <script>
    let cart = 0;

    function addToCart() {
      cart++;
      document.getElementById("cartCount").innerText = cart;
      alert("Product added to cart!");
    }
  </script>

</body>
</html>
